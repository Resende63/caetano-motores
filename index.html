<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Caetano Motores</title>
    <style>
        :root {
            --primary: #2e7d32; /* Verde Motor */
            --bg: #121212;
            --card: #1e1e1e;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 0;
            margin-bottom: 25px;
        }

        .card {
            background-color: var(--card);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-left: 5px solid var(--primary);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .btn-save {
            background-color: var(--primary);
            color: white;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(0.99);
        }

        .history-title {
            margin-top: 30px;
            color: var(--primary);
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .os-item {
            background-color: var(--card);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 3px solid #555;
        }

        .os-header {
            display: flex;
            justify-content: space-between;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .os-date {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .price-tag {
            color: #25d366;
            font-weight: bold;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Caetano Motores</h1>
    <p class="subtitle">Controle de Serviços Simplificado</p>

    <div class="card">
        <div class="form-group">
            <label for="cliente">Nome do Cliente</label>
            <input type="text" id="cliente" placeholder="Ex: João Silva">
        </div>

        <div class="form-group">
            <label for="whatsapp">WhatsApp do Cliente (com DDD)</label>
            <input type="text" id="whatsapp" placeholder="Ex: 27999998888">
        </div>

        <div class="form-group">
            <label for="defeito">O que o cliente disse? (Problema)</label>
            <textarea id="defeito" placeholder="Ex: Motor é novo porém parou"></textarea>
        </div>

        <div class="form-group">
            <label for="servico">O que o Caetano fez? (Solução)</label>
            <textarea id="servico" placeholder="Ex: Trocado rolamento travado e rebobinado os fios"></textarea>
        </div>

        <div class="form-group">
            <label for="valor">Valor do Serviço (R\$)</label>
            <input type="number" id="valor" placeholder="Ex: 350">
        </div>

        <button class="btn-save" onclick="salvarOS()">💾 Salvar no Histórico</button>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">💬 Enviar Orçamento via WhatsApp</button>
    </div>

    <h3 class="history-title">Últimos Serviços Registrados</h3>
    <div id="lista-os"></div>
</div>

<script>
    // Carrega os dados salvos ao abrir a página
    document.addEventListener("DOMContentLoaded", carregarHistorico);

    function salvarOS() {
        const cliente = document.getElementById("cliente").value;
        const whatsapp = document.getElementById("whatsapp").value;
        const defeito = document.getElementById("defeito").value;
        const servico = document.getElementById("servico").value;
        const valor = document.getElementById("valor").value;

        if (!cliente || !defeito || !valor) {
            alert("Por favor, preencha pelo menos o Nome, o Problema e o Valor!");
            return;
        }

        const novaOS = {
            cliente,
            whatsapp,
            defeito,
            servico,
            valor,
            data: new Date().toLocaleDateString('pt-BR')
        };

        let historico = JSON.parse(localStorage.getItem("caetano_motores_os")) || [];
        historico.unshift(novaOS); // Adiciona no início da lista
        localStorage.setItem("caetano_motores_os", JSON.stringify(historico));

        carregarHistorico();
        limparCampos();
        alert("Serviço salvo com sucesso no histórico!");
    }

    function carregarHistorico() {
        const lista = document.getElementById("lista-os");
        lista.innerHTML = "";
        
        let historico = JSON.parse(localStorage.getItem("caetano_motores_os")) || [];

        if (historico.length === 0) {
            lista.innerHTML = "<p style='color: #aaa; text-align: center;'>Nenhum serviço registrado ainda.</p>";
            return;
        }

        historico.forEach(os => {
            const item = document.createElement("div");
            item.className = "os-item";
            item.innerHTML = `
                <div class="os-header">
                    <span>${os.cliente}</span>
                    <span class="os-date">${os.data}</span>
                </div>
                <p><strong>Problema relatado:</strong> ${os.defeito}</p>
                <p><strong>Serviço feito:</strong> ${os.servico || 'Não informado'}</p>
                <span class="price-tag">Valor: R$ ${parseFloat(os.valor).toFixed(2)}</span>
            `;
            lista.appendChild(item);
        });
    }

    function enviarWhatsApp() {
        const cliente = document.getElementById("cliente").value;
        const whatsapp = document.getElementById("whatsapp").value.replace(/\D/g, ''); // Remove o que não for número
        const defeito = document.getElementById("defeito").value;
        const servico = document.getElementById("servico").value;
        const valor = document.getElementById("valor").value;

        if (!cliente || !valor || !whatsapp) {
            alert("Para enviar o WhatsApp, você precisa preencher o Nome, o Celular do Cliente e o Valor!");
            return;
        }

        // Monta a mensagem bonita automática
        let mensagem = `Olá ${cliente}! Aqui é o Caetano Motores. 👍%0A%0A`;
        mensagem += `*Problema relatado:* ${defeito}%0A`;
        if(servico) {
            mensagem += `*Serviço executado:* ${servico}%0A`;
        }
        mensagem += `*Valor total:* R$ ${parseFloat(valor).toFixed(2)}%0A%0A`;
        mensagem += `Seu motor está pronto/orçado! Qualquer dúvida estou à disposição.`;

        // Abre o link do WhatsApp com o número e a mensagem
        const url = `https://wa.me{whatsapp}?text=${mensagem}`;
        window.open(url, '_blank');
    }

    function limparCampos() {
        document.getElementById("cliente").value = "";
        document.getElementById("whatsapp").value = "";
        document.getElementById("defeito").value = "";
        document.getElementById("servico").value = "";
        document.getElementById("valor").value = "";
    }
</script>

</body>
</html>
